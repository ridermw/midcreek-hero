<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: black; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
#status, #status-splash { top: 0; bottom: 0; }
#status { background-color: #242424; display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; }
#status-splash { max-height: 100%; max-width: 90%; margin: auto; image-rendering: pixelated; }
#status-progress, #status-notice { display: none; }
#status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
#status-notice { background-color: #5b3943; border-radius: .5rem; border: 1px solid #9b3943; color: #e0e0e0; font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center; z-index: 1; }
</style>
<link rel="stylesheet" href="mobile.css">
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>
<div id="status">
<img id="status-splash" src="$GODOT_SPLASH" alt="Midcreek Hero">
<progress id="status-progress"></progress>
<div id="status-notice"></div>
</div>
<script src="mobile.js"></script>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
if (window.MidcreekTouch?.enabled) {
  GODOT_CONFIG.canvasResizePolicy = 0;
  GODOT_CONFIG.focusCanvas = false;
  document.getElementById("canvas").width = 960;
  document.getElementById("canvas").height = 720;
}
const engine = new Engine(GODOT_CONFIG);
const overlay = document.getElementById("status");
const progress = document.getElementById("status-progress");
const notice = document.getElementById("status-notice");
function failure(error) {
  console.error(error);
  notice.textContent = error instanceof Error ? error.message : String(error);
  notice.style.display = "block";
  progress.style.display = "none";
  overlay.style.visibility = "visible";
}
const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
if (missing.length) {
  failure("The following browser features are missing: " + missing.join(", "));
} else {
  overlay.style.visibility = "visible";
  progress.style.display = "block";
  engine.startGame({onProgress(current, total) {
    if (current > 0 && total > 0) { progress.value = current; progress.max = total; }
    else { progress.removeAttribute("value"); progress.removeAttribute("max"); }
  }}).then(() => {
    overlay.remove();
    if (!window.MidcreekTouch) {
      const warning = document.createElement("p");
      warning.setAttribute("role", "alert");
      warning.textContent = "The touch interface did not load. Reload this page. Desktop controls remain available.";
      warning.style.cssText = "position:fixed;bottom:0;left:0;right:0;padding:12px;background:#5b3943;color:white";
      document.body.append(warning);
      console.error(warning.textContent);
    }
  }, failure);
}
</script>
</body>
</html>
