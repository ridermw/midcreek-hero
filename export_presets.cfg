[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="art/cel-shift/sprites/manifest.json,art/cel-shift/animations/manifest.json,levels/*.level,art/cel-shift/catalog.json,art/cel-shift/tiles/manifest.json,art/cel-shift/hazards/manifest.json,art/cel-shift/props/manifest.json,art/cel-shift/ui/manifest.json"
exclude_filter="art/cel-shift/sprites/generated/*,art/cel-shift/sprites/sheets/*,art/cel-shift/sprites/preview.png,art/cel-shift/animations/generated/*,art/cel-shift/animations/previews/*,art/cel-shift/environment/generated/*,art/cel-shift/tiles/generated/*,art/cel-shift/hazards/generated/*,art/cel-shift/props/generated/*,art/cel-shift/ui/generated/*,art/cel-shift/*/prompts/*,tests/*"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
