name: Godot web viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check asset pipeline contracts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python3 -m pip install -r tools/requirements.txt
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/audio_assets.py check

      - name: Install official Godot and web export templates
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          engine="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 "$base/$engine" --output "$engine"
          curl --fail --location --retry 3 "$base/$templates" --output "$templates"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          grep -F -e "$engine" -e "$templates" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$engine" -d godot-bin
          install -D -m 755 "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          unzip -j -q "$templates" \
            templates/web_nothreads_release.zip \
            templates/web_nothreads_debug.zip \
            templates/version.txt -d "$target"

      - name: Import project
        run: |
          godot --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -E '^(SCRIPT ERROR|ERROR|USER ERROR|Parse Error)' "$RUNNER_TEMP/import.log"

      - name: Run Godot tests
        run: |
          for t in tests/*_test.gd; do
            case "$t" in
              tests/export_test.gd) continue ;;
            esac
            tools/godot_test.sh "$t" "$(basename "$t" .gd | tr '[:lower:]' '[:upper:]')"
          done

      - name: Export single-threaded web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee "$RUNNER_TEMP/export.log"
          ! grep -E '^(SCRIPT ERROR|ERROR|USER ERROR|Parse Error)' "$RUNNER_TEMP/export.log"
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          touch build/web/.nojekyll

      - name: Check exported runtime resources
        run: |
          timeout 120s godot --headless --path "$RUNNER_TEMP" \
            --main-pack "$GITHUB_WORKSPACE/build/web/index.pck" \
            --script "$GITHUB_WORKSPACE/tests/export_test.gd" 2>&1 | tee "$RUNNER_TEMP/export-test.log"
          grep -Eq '^EXPORT_TEST_COMPLETE: [1-9][0-9]* checks, 0 failures$' "$RUNNER_TEMP/export-test.log"
          ! grep -E '^(SCRIPT ERROR|ERROR|USER ERROR|Parse Error)' "$RUNNER_TEMP/export-test.log"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
