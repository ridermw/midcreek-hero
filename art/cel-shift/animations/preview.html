<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midcreek animation proof</title>
<style>
  body { margin: 0; padding: 32px; background: #e4e8ee; color: #1e2b38; font: 16px system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { max-width: 760px; }
  main { display: flex; flex-wrap: wrap; gap: 24px; }
  figure { margin: 0; }
  img { display: block; width: 416px; max-width: 100%; image-rendering: pixelated; border: 1px solid #bdc6d0; }
  figcaption { padding: 10px 0; font-weight: 600; }
  a { color: #164e82; }
</style>
<h1>Midcreek / animation proof</h1>
<p>Normal male only so far. These are looping previews of individually rendered frames,
not the completed interactive game. Framing has been normalized; motion consistency
is still under review. Female cycles will follow.</p>
<main>
  <figure>
    <img src="previews/man-midcreek/idle.gif" alt="Normal male idle animation">
    <figcaption>Idle / 6 frames / 6 fps</figcaption>
    <a href="previews/man-midcreek/idle.png">Inspect all idle frames</a>
  </figure>
  <figure>
    <img src="previews/man-midcreek/walk.gif" alt="Normal male walk animation">
    <figcaption>Walk / 8 frames / 10 fps</figcaption>
    <a href="previews/man-midcreek/walk.png">Inspect all walk frames</a>
  </figure>
</main>
</html>
